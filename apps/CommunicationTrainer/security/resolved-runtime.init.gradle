// Transitive, *resolved* runtime Maven modules of the exact Android debug variant.
// No changes to production application code or declared dependencies.
gradle.projectsEvaluated {
    def p = gradle.rootProject.project(":app")
    p.tasks.register("dumpSecurityRuntimeModules") {
        doLast {
            def resolved = p.configurations.getByName("debugRuntimeClasspath")
                .incoming.resolutionResult.allComponents
            def modules = resolved.findAll { it.moduleVersion != null }
                .collect { it.moduleVersion }
                .unique { it.group + ":" + it.name + ":" + it.version }
                .sort { a, b ->
                    (a.group + ":" + a.name + ":" + a.version) <=>
                    (b.group + ":" + b.name + ":" + b.version)
                }
            modules.each { m ->
                println("SECURITY_DEP " + m.group + " " + m.name + " " + m.version)
            }
            println("SECURITY_MODULE_COUNT " + modules.size())
        }
    }
}
