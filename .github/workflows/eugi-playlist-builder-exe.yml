name: Eugi Playlist Builder Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'PC/EugiPlaylistBuilder/**'
      - '.github/workflows/eugi-playlist-builder-exe.yml'
  workflow_dispatch:

jobs:
  portable-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PC/EugiPlaylistBuilder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EugiPlaylistBuilder app.py
      - uses: actions/upload-artifact@v4
        with:
          name: EugiPlaylistBuilder-Windows-portable
          path: PC/EugiPlaylistBuilder/dist/EugiPlaylistBuilder.exe
          if-no-files-found: error
