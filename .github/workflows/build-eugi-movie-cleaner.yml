name: Build Eugi Movie Cleaner EXE
on:
  push:
    paths:
      - 'EugiMovieCleaner/**'
      - '.github/workflows/build-eugi-movie-cleaner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EugiMovieCleaner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Entpacke Quellcode
        run: python -c "import base64,io,tarfile,pathlib; b=base64.b64decode(pathlib.Path('source.tar.gz.b64').read_text().strip()); tarfile.open(fileobj=io.BytesIO(b),mode='r:gz').extractall(path='.',filter='data')"
      - name: Unit tests
        run: python -m unittest discover -p "test_*.py" -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Baue Windows-EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name EugiMovieCleaner movie_cleaner.py
      - name: EXE zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: EugiMovieCleaner-Windows-EXE
          path: EugiMovieCleaner/dist/EugiMovieCleaner.exe
          if-no-files-found: error
