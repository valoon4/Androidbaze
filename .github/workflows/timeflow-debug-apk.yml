name: Build TimeFlow Debug APK

on:
  push:
    branches: ["main"]
    paths:
      - "games/TimeFlow/**"
      - ".github/workflows/timeflow-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: games/TimeFlow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify web app JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle89.zip
          unzip -q /tmp/gradle89.zip -d /tmp
          echo /tmp/gradle-8.9/bin >> "$GITHUB_PATH"
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify and rename APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk TimeFlow-debug.apk
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeFlow-debug-apk
          path: games/TimeFlow/TimeFlow-debug.apk
          if-no-files-found: error
          retention-days: 30
