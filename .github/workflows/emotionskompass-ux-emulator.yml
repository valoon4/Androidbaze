name: Emotionskompass Android UX Emulator

on:
  pull_request:
    paths:
      - "games/Emotionskompass/src/**"
      - ".github/workflows/emotionskompass-ux-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

# Avoid simultaneously booting multiple emulator VMs for successive PR commits.
concurrency:
  group: emotionskompass-ux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for Android Emulator
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install SDK 36 for compilation
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: Run actual Compose UI tests at 100% and 200% font sizes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # The emulator action executes each line in a fresh shell; use -p
            # rather than cd, otherwise a different root Gradle app is tested.
            adb shell settings put system font_scale 1.0
            gradle -p games/Emotionskompass/src :app:connectedDebugAndroidTest --no-daemon --stacktrace
            adb shell wm size 720x1280
            adb shell wm density 360
            adb shell settings put system font_scale 2.0
            gradle -p games/Emotionskompass/src :app:connectedDebugAndroidTest --no-daemon --stacktrace --rerun-tasks
            # Fail the run if the target project did not execute actual tests.
            test -n "$(find games/Emotionskompass/src/app/build/outputs/androidTest-results/connected -name '*.xml' -print -quit)"
            grep -R -q "StrategyNavigationEmulatorTest" games/Emotionskompass/src/app/build/outputs/androidTest-results/connected
      - name: Upload test report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emotionskompass-Android-UX-emulator-report
          path: |
            games/Emotionskompass/src/app/build/outputs/androidTest-results/**
            games/Emotionskompass/src/app/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 14
