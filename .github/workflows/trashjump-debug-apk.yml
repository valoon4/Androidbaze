name: Build Trash Jump APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "games/TrashJump/**"
      - ".github/workflows/trashjump-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/TrashJump
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          command -v sdkmanager
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo /opt/gradle/gradle-8.11.1/bin >> "$GITHUB_PATH"
      - name: Build Trash Jump debug APK
        run: gradle clean assembleDebug --no-daemon --stacktrace
      - name: Upload Trash Jump APK
        uses: actions/upload-artifact@v4
        with:
          name: TrashJump-v1-debug-APK
          path: games/TrashJump/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
