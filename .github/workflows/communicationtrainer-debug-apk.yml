name: CommunicationTrainer Debug APK

on:
  push:
    branches: [main]
    paths:
      - "apps/CommunicationTrainer/android/**"
      - "apps/CommunicationTrainer/benchmarks/d04/**"
      - ".github/workflows/communicationtrainer-debug-apk.yml"
  pull_request:
    paths:
      - "apps/CommunicationTrainer/android/**"
      - "apps/CommunicationTrainer/benchmarks/d04/**"
      - ".github/workflows/communicationtrainer-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: communicationtrainer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, unit-test and verify CommunicationTrainer debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/CommunicationTrainer/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pin Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      # Ubuntu runners already ship Android command-line tools. Avoid setup-android@v3,
      # which calls the removed "sdkmanager tools" package and fails on current runners.
      - name: Install Android API 36 using preinstalled command-line tools
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
      - name: D04 offline benchmark suite and no-false-quality tests
        run: |
          python3 -m unittest discover -s ../benchmarks/d04 -p 'test_*.py' -v
          python3 ../benchmarks/d04/evaluate.py --output d04-evaluation-summary.json
      - name: Unit tests (D04 gateway, D03 chats and persistence)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Verify exported Room v1 schema
        run: |
          set -euo pipefail
          SCHEMA="$(find app/schemas -type f -name '1.json' -print -quit)"
          test -s "$SCHEMA"
          jq -e '.database.version == 1' "$SCHEMA" > /dev/null
          # Generated schema must match the checked-in baseline exactly.
          # Schema changes require an explicit version bump + migration test.
          git diff --exit-code -- "$SCHEMA"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK identity, target API and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -Fq "package: name='com.valoon4.communicationtrainer.d05openingpreview'" apk-badging.txt
          grep -Fq "application-label:'CommunicationTrainer D05 Einstieg'" apk-badging.txt
          grep -Fq "targetSdkVersion:'36'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          cp "$APK" CommunicationTrainer-D05-Einstieg-debug.apk
          sha256sum CommunicationTrainer-D05-Einstieg-debug.apk | tee CommunicationTrainer-D05-Einstieg-debug.apk.sha256
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CommunicationTrainer-D05-Einstieg-debug-apk
          path: |
            apps/CommunicationTrainer/android/CommunicationTrainer-D05-Einstieg-debug.apk
            apps/CommunicationTrainer/android/CommunicationTrainer-D05-Einstieg-debug.apk.sha256
            apps/CommunicationTrainer/android/apk-badging.txt
            apps/CommunicationTrainer/android/apk-signing.txt
            apps/CommunicationTrainer/android/d04-evaluation-summary.json
            apps/CommunicationTrainer/android/app/schemas/**/1.json
          if-no-files-found: error
          retention-days: 30
