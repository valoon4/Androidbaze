name: Build Ape Economics Debug APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "games/ApeEconomics/**"
      - ".github/workflows/apeeconomics-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: games/ApeEconomics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo /opt/gradle/gradle-8.11.1/bin >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload v0.15 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ApeEconomics-v0.15-debug
          path: games/ApeEconomics/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
