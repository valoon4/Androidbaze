name: Build Ape Economics 2.0 APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "games/ApeEconomics/**"
      - ".github/workflows/apeeconomics-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: games/ApeEconomics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_TOOL="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_TOOL"
          echo "$(dirname "$SDK_TOOL")" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo /opt/gradle/gradle-8.11.1/bin >> "$GITHUB_PATH"
      - name: Render authored PNG pixel world
        run: |
          python3 -m pip install --user Pillow
          APE_ART_OUTPUT=app/src/main/res/drawable-nodpi/ape_v23_world.png python3 scripts/generate_art.py
          test -s app/src/main/res/drawable-nodpi/ape_v23_world.png
      - name: Upload PNG art for visual quality review
        uses: actions/upload-artifact@v4
        with:
          name: ApeEconomics-v23-world-art-preview
          path: games/ApeEconomics/app/src/main/res/drawable-nodpi/ape_v23_world.png
          if-no-files-found: error
          retention-days: 30
      - name: Build Ape Economics 2.0 APK
        run: gradle clean assembleDebug --no-daemon --stacktrace
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ApeEconomics-v2-Level0-debug
          path: games/ApeEconomics/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if ! gh release view apeeconomics-v2-level0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create apeeconomics-v2-level0 --repo "$GITHUB_REPOSITORY" \
              --title "Ape Economics 2.0 — Level 0" --notes "Playable pixel-art level hub and tutorial. Work-in-progress." --prerelease
          fi
          gh release upload apeeconomics-v2-level0 "$apk#ApeEconomics-v2-debug.apk" --repo "$GITHUB_REPOSITORY" --clobber
