name: Build Ape Economics Debug APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "games/ApeEconomics/**"
      - ".github/workflows/apeeconomics-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: games/ApeEconomics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;default;x86_64"
      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo /opt/gradle/gradle-8.11.1/bin >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Boot visual emulator
        timeout-minutes: 4
        run: |
          echo no | avdmanager create avd -n ape_visual -k "system-images;android-35;default;x86_64" --device "pixel_2" --force
          nohup emulator -avd ape_visual -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel off -memory 1536 >/tmp/emulator.log 2>&1 &
          timeout 45 adb wait-for-device || { cat /tmp/emulator.log; exit 1; }
          for i in $(seq 1 60); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then
            echo "Emulator failed to boot"; cat /tmp/emulator.log; exit 1
          fi
          adb shell input keyevent 82 || true
          adb shell settings put system accelerometer_rotation 0
          adb shell wm size 1080x1920
          adb shell wm density 420
      - name: Capture runtime screenshot
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.eugi.apeeconomics
          adb shell monkey -p com.eugi.apeeconomics 1 >/dev/null
          sleep 2
          adb exec-out screencap -p > visual-current.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('visual-current.png')
          if p.stat().st_size < 10000 or not p.read_bytes().startswith(b'\x89PNG'):
              raise SystemExit('Visual screenshot invalid')
          print('Screenshot OK:', p.stat().st_size, 'bytes')
          PY
      - name: Upload visual screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ApeEconomics-v0.11-visual-screenshot
          path: games/ApeEconomics/visual-current.png
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApeEconomics-v0.11-visual-debug
          path: games/ApeEconomics/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
