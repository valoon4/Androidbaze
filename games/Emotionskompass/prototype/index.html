const getWord=id=>CATALOG.find(e=>e.id===id),getName=id=>getWord(id)?.name||id;
function rankWord(w,q){const n=w.name.toLocaleLowerCase('de');if(n===q)return 0;if(n.startsWith(q))return 1;if(n.includes(q))return 2;if(w.related.some(v=>v.toLocaleLowerCase('de').includes(q)))return 3;return 4}
function filterWords(family,query){const q=query.trim().toLocaleLowerCase('de');const words=CATALOG.filter(w=>(family==='all'||w.family===family)&&(!q||[w.name,w.definition,...w.related,...w.contrast].join(' ').toLocaleLowerCase('de').includes(q)));return q?words.sort((a,b)=>rankWord(a,q)-rankWord(b,q)||a.name.localeCompare(b.name,'de')):words}
const sections={home:'Start',atlas:'Entdecken',journal:'Tagebuch',insights:'Rückblick'};

const prompts=[{key:'situation',heading:'Was ist passiert?',hint:'Beschreibe die Situation möglichst so, wie sie beobachtbar war – ohne sie gleich bewerten zu müssen.',placeholder:'Was ist geschehen? Wer oder was war beteiligt?'},{key:'thoughts',heading:'Was ging dir durch den Kopf?',hint:'Gedanken können Gefühle beeinflussen, sind aber nicht dasselbe.',placeholder:'Welche Gedanken, Erwartungen oder Vermutungen hattest du?'},{key:'body',heading:'Was hast du körperlich wahrgenommen?',hint:'Vielleicht Enge, Wärme, Ruhe oder Anspannung. Auch „nichts“ ist okay.',placeholder:'Was konntest du in deinem Körper spüren?'},{key:'needs',heading:'Was hättest du gebraucht?',hint:'Vielleicht Nähe, Klarheit, Erholung, Sicherheit oder Selbstbestimmung.',placeholder:'Welches Bedürfnis könnte in dieser Situation wichtig gewesen sein?'},{key:'reaction',heading:'Wie hast du reagiert?',hint:'Ohne Bewertung. Jede Reaktion kann ein Ausgangspunkt für Verständnis sein.',placeholder:'Was hast du getan oder gesagt – oder nicht getan?'},{key:'insight',heading:'Was nimmst du für dich mit?',hint:'Es muss keine Lösung geben. Eine kleine Beobachtung reicht.',placeholder:'Was verstehst du jetzt etwas besser?'}];
function activeNav(){return app.screen==='home'?'home':['atlas','detail','compare'].includes(app.screen)?'atlas':['journal','journalDetail'].includes(app.screen)?'journal':app.screen==='insights'?'insights':null}
function nav(to,opts={}){if(to===app.screen&&!opts.force)return;app.stack.push(app.screen);app.screen=to;app.confirmDelete=false;render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('mainContent').focus({preventScroll:true})}
function goMain(to){app.stack=[];app.screen=to;app.confirmDelete=false;render();window.scrollTo({top:0,behavior:'instant'})}
function back(){if(app.stack.length){app.screen=app.stack.pop();render();window.scrollTo({top:0,behavior:'instant'})}else goMain('home')}
function resetDraft(){app.entryPath='unknown';app.valence=null;app.energy=null;app.selected={};app.notes={situation:'',thoughts:'',body:'',needs:'',reaction:'',insight:''};app.reflectionIndex=0;app.choiceFamily='all';app.choiceQuery='';app.mode='deep';app.journalEditId=null}
function beginFlow(mode,source,emotion){resetDraft();app.mode=mode||'deep';app.entryPath=source||'unknown';if(emotion)app.selected[emotion]=null;nav('sense')}
function pillFor(id){return `<span class="tag">${esc(getName(id))}</span>`}
function backBtn(){return `<button class="back" data-action="back">${icon('back',18)} Zurück</button>`}
function heading(micro,title,sub=''){return `<div class="page-heading"><div class="micro">${micro}</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`}
function button(text,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${text}</button>`}
function familyInfo(id){return FAMILIES.find(f=>f.id===id)}
function navMarkup(){let list=[['home','home','Start'],['atlas','compass','Entdecken'],['journal','journal','Tagebuch'],['insights','chart','Rückblick']];document.getElementById('desktopNav').innerHTML=list.map(([target,ic,label])=>`<button class="nav-item ${activeNav()===target?'active':''}" data-main="${target}" ${activeNav()===target?'aria-current="page"':''}>${icon(ic,20)}<span>${label}</span></button>`).join('');document.getElementById('mobileNav').innerHTML=list.map(([target,ic,label])=>`<button class="${activeNav()===target?'active':''}" data-main="${target}" ${activeNav()===target?'aria-current="page"':''}>${icon(ic,20)}<span>${label}</span></button>`).join('')}
function home(){return `<div class="hero"><div class="hero-copy"><div class="micro">WILLKOMMEN IN DEINEM RAUM</div><h1>Gefühle verstehen.<br>Dir selbst näherkommen.</h1><p>Was immer du gerade fühlst: Hier kannst du es in Ruhe erkunden – ohne richtig oder falsch.</p><div class="hero-buttons"><button class="btn" data-action="flowStart">${icon('heart',17)} Gefühl erkunden ${icon('arrow',16)}</button><button class="btn ghost" data-main="atlas">${icon('book',16)} Emotionen entdecken</button></div></div><div class="hero-visual" aria-hidden="true"><svg viewBox="0 0 220 220"><path d="M112 200V65C64 65 43 34 43 12c47-1 69 35 69 73m0 49c0-78 40-114 96-119-2 76-38 120-96 119" fill="none" stroke="#578473" stroke-width="10" stroke-linecap="round"/></svg></div></div><div class="section-row"><h2>Zwei Wege, ein Ziel</h2><span class="micro">DU ENTSCHEIDEST</span></div><div class="grid-2"><button class="card action sage" data-action="flowStart"><span class="round-icon pine">${icon('heart',22)}</span><h3>Mich selbst verstehen</h3><p>Erkunde, was in dir vorgeht, und halte eine persönliche Erfahrung fest.</p><div class="flex strong" style="color:var(--pine);font-size:13px;margin-top:16px">Check-in starten ${icon('arrow',16)}</div></button><button class="card action" data-main="atlas"><span class="round-icon sand">${icon('book',22)}</span><h3>Emotionen verstehen</h3><p>Entdecke Worte, die bisher vielleicht noch keinen Platz in deinem Wortschatz hatten.</p><div class="flex strong" style="color:var(--pine);font-size:13px;margin-top:16px">Atlas erkunden ${icon('arrow',16)}</div></button></div><div class="section-row"><h2>Ein Gefühl entdecken</h2><button class="link-btn" data-main="atlas">Zum Atlas ${icon('arrow',15)}</button></div><button class="card action word-card" data-action="detail" data-id="wehmut"><span class="round-icon sand">${icon('sparkle',22)}</span><div class="grow"><span class="micro">DEIN WORTIMPULS</span><strong>Wehmut</strong><p>Wenn etwas Schönes zugleich ein wenig traurig macht.</p></div>${icon('chevron',20)}</button><div style="height:17px"></div><div class="notice">${icon('shield',19)}<div><strong>Dein Tempo zählt.</strong> Du kannst jederzeit überspringen, abbrechen oder „Ich weiß nicht“ wählen. In dieser Vorschau wird nichts dauerhaft gespeichert.</div></div>`}
function atlas(){const query=app.atlasQuery.toLocaleLowerCase('de').trim();const words=filterWords(app.atlasFamily,app.atlasQuery);return `${heading('WISSEN · ENTDECKEN','Der Emotionsatlas','Jedes Gefühl hat Nuancen. Folge deiner Neugier oder suche ein Wort, das gerade zu dir passt.')}<div class="search mb-20">${icon('search')}<input id="atlasSearch" type="search" placeholder="Nach Gefühlen oder Begriffen suchen …" value="${esc(app.atlasQuery)}" aria-label="Emotionsatlas durchsuchen"></div><div class="section-row"><h2>Emotionsfamilien</h2><button class="link-btn" data-action="clearFamily">Alle anzeigen</button></div><div class="family-grid">${FAMILIES.map(f=>`<button class="family ${app.atlasFamily===f.id?'selected':''}" data-action="family" data-id="${f.id}" aria-pressed="${app.atlasFamily===f.id}"><span class="family-symbol" style="--fc:${f.color}" aria-hidden="true">${f.symbol}</span><strong>${f.name}</strong><span>${CATALOG.filter(e=>e.family===f.id).length} Begriffe</span></button>`).join('')}</div><div class="section-row"><h2>${app.atlasFamily==='all'?'Alle Begriffe':familyInfo(app.atlasFamily)?.name||'Begriffe'}</h2><span class="muted" style="font-size:13px">${words.length} Treffer</span></div><div id="atlasResults">${atlasResultMarkup(words)}</div><div class="section-row"><h2>Ähnliche Gefühle unterscheiden</h2></div><button class="card action word-card" data-action="comparePreset"><span class="round-icon">${icon('layers',22)}</span><div class="grow"><strong>Frustration oder Enttäuschung?</strong><p>Entdecke, wo sich diese Gefühle ähneln – und worin sie sich unterscheiden.</p></div>${icon('chevron')}</button>`}
function atlasResultMarkup(words){return words.length?words.map(e=>`<button class="result-row" data-action="detail" data-id="${e.id}"><span class="round-icon" style="background:${familyInfo(e.family)?.color||'#e9f0e9'};width:40px;height:40px">${esc(familyInfo(e.family)?.symbol||'◌')}</span><span class="result-copy"><strong>${esc(e.name)}</strong><small>${esc(e.definition)}</small></span>${icon('chevron',17)}</button>`).join(''):`<div class="empty"><span class="round-icon">${icon('search',20)}</span><strong>Kein passender Begriff gefunden</strong><p>Probiere ein anderes Wort oder entferne den Kategorienfilter.</p><button class="btn secondary mt-14" data-action="resetAtlas">Filter zurücksetzen</button></div>`}
function detail(){const e=getWord(app.detail)||getWord('frustration');return `${backBtn()}<div class="detail-layout"><div><div class="detail-hero"><div class="pill-row"><span class="tag">${esc(familyInfo(e.family).name)}</span><span class="tag outline">Begriff entdecken</span></div><h1>${esc(e.name)}</h1><p>${esc(e.definition)}</p><div class="button-group"><button class="btn" data-action="flowFromWord" data-id="${e.id}">${icon('edit',17)} Darüber reflektieren</button><button class="btn ghost" data-action="compareFromWord" data-id="${e.id}">${icon('layers',17)} Vergleichen</button></div></div><div class="detail-grid mt-20"><div class="card"><h3>So könnte es im Alltag aussehen</h3><div class="quote">„${esc(e.example)}“</div></div><div class="card"><h3>Eine Frage zum Weiterdenken</h3><p>Wann hast du etwas Ähnliches erlebt? Gibt es vielleicht noch einen anderen Begriff, der besser passt?</p></div></div></div><div class="detail-grid" style="align-content:start"><div class="card"><h3>Verwandte Gefühle</h3><div class="pill-row">${e.related.map(name=>{let w=CATALOG.find(x=>x.name===name);return `<button class="chip" data-action="detail" data-id="${w?.id||''}" ${w?'':'disabled'}>${esc(name)} ${icon('chevron',12)}</button>`}).join('')}</div><div class="divider"></div><h3>Zum Unterscheiden</h3><div class="pill-row">${e.contrast.map(name=>{let w=CATALOG.find(x=>x.name===name);return `<button class="chip" data-action="compareSpecific" data-id="${e.id}" data-other="${w?.id||e.id}">${esc(name)} ${icon('arrow',12)}</button>`}).join('')}</div></div><div class="notice">${icon('info',18)}<span>Definitionen sind Orientierungshilfen. Wie sich ein Gefühl für dich anfühlt, kann anders sein.</span></div></div></div>`}
function compare(){const A=getWord(app.compareA)||CATALOG[0],B=getWord(app.compareB)||CATALOG[1];return `${backBtn()}${heading('WISSEN · DIFFERENZIEREN','Zwei Gefühle im Vergleich','Ähnliche Worte können unterschiedliche Aspekte einer Erfahrung beschreiben.')}<div class="pairs"><div class="field"><label for="compareA">Erstes Gefühl</label><select id="compareA">${CATALOG.map(w=>`<option value="${w.id}" ${A.id===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label for="compareB">Zweites Gefühl</label><select id="compareB">${CATALOG.map(w=>`<option value="${w.id}" ${B.id===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div></div><div class="pairs"><div class="compare-pane"><span class="micro">GEFÜHL A</span><h2>${esc(A.name)}</h2><p>${esc(A.definition)}</p><div class="quote">„${esc(A.example)}“</div></div><div class="compare-pane"><span class="micro">GEFÜHL B</span><h2>${esc(B.name)}</h2><p>${esc(B.definition)}</p><div class="quote">„${esc(B.example)}“</div></div></div><div class="card mt-20"><h3>Was unterscheidet sie?</h3><p class="sub" style="margin-top:9px">${A.id==='frustration'&&B.id==='enttaeuschung'||A.id==='enttaeuschung'&&B.id==='frustration'?'Frustration betont häufig das erlebte Hindernis auf dem Weg zu einem Ziel. Enttäuschung steht eher mit einer unerfüllten Erwartung oder Hoffnung in Verbindung. Beide können zugleich auftreten.':'Beachte, was im jeweiligen Begriff im Vordergrund steht: die Situation, eine Erwartung, ein Bedürfnis oder die innere Reaktion. Die Bedeutungen können sich überschneiden.'}</p><div class="divider"></div><h3>Was haben sie gemeinsam?</h3><p class="sub" style="margin-top:9px">Beide Begriffe können eine persönlich bedeutsame Erfahrung beschreiben. Welcher für dich zutrifft, kann nur deine eigene Einordnung zeigen.</p><div class="button-group mt-20"><button class="btn secondary" data-action="detail" data-id="${A.id}">Mehr über ${esc(A.name)}</button><button class="btn ghost" data-action="detail" data-id="${B.id}">Mehr über ${esc(B.name)}</button></div></div>`}
function flowStart(){return `${backBtn()}<div class="flow-shell">${heading('REFLEXION · DEIN AUSGANGSPUNKT','Was führt dich gerade hierher?','Es gibt keinen falschen Einstieg. Entscheide einfach, was sich für diesen Moment richtig anfühlt.')}<div class="flow-card" style="padding:18px 20px;margin-bottom:20px"><div class="micro">WIE MÖCHTEST DU VORGEHEN?</div><div class="choice-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:13px"><button class="choice ${app.mode==='quick'?'selected':''}" data-action="setMode" data-value="quick" aria-pressed="${app.mode==='quick'}">${icon('clock',16)} Kurz · ca. 1 Min.</button><button class="choice ${app.mode==='deep'?'selected':''}" data-action="setMode" data-value="deep" aria-pressed="${app.mode==='deep'}">${icon('edit',16)} Mit Reflexion</button></div></div><div class="option-list"><button class="option" data-action="chooseEntry" data-path="unknown"><span class="round-icon">${icon('compass',20)}</span><span><strong>Ich weiß nicht genau, was ich fühle</strong><small>Wir nähern uns dem Gefühl behutsam an.</small></span>${icon('chevron',18)}</button><button class="option" data-action="chooseEntry" data-path="some"><span class="round-icon sand">${icon('heart',20)}</span><span><strong>Ich habe schon eine Ahnung</strong><small>Ich möchte einen passenden Begriff finden.</small></span>${icon('chevron',18)}</button><button class="option" data-action="chooseEntry" data-path="situation"><span class="round-icon">${icon('edit',20)}</span><span><strong>Ich möchte eine Situation einordnen</strong><small>Ich will meine Gedanken und Gefühle sortieren.</small></span>${icon('chevron',18)}</button></div><div class="notice mt-20">${icon('info',18)}<span>Du kannst den Check-in schnell oder ausführlich gestalten. Alles ist freiwillig.</span></div></div>`}
function situationFirst(){return `${backBtn()}<div class="flow-shell">${progress(1,4)}<div class="flow-head"><span class="micro">DEIN AUSGANGSPUNKT · FREIWILLIG</span><h1>Was ist passiert?</h1><p class="sub">Manchmal hilft es, zuerst die Situation festzuhalten und erst danach nach passenden Gefühlen zu suchen.</p></div><div class="flow-card"><div class="field"><label for="introSituation">Die Situation in deinen Worten</label><textarea id="introSituation" placeholder="Was möchtest du besser verstehen?">${esc(app.notes.situation)}</textarea></div><div class="flow-footer"><button class="btn text" data-action="skipIntro">Überspringen</button><button class="btn" data-action="fromIntro">Weiter ${icon('arrow',16)}</button></div></div></div>`}
function progress(current,total){return `<div class="check-progress" role="img" aria-label="Fortschritt ${current} von ${total} Schritten">${Array.from({length:total},(_,i)=>`<span class="${i<current?'done':''}"></span>`).join('')}</div>`}
function choiceQuestion(title,options,value,kind){return `<div class="question-label">${title}</div><div class="choice-grid">${options.map(o=>`<button class="choice ${value===o.id?'selected':''}" data-action="${kind}" data-value="${o.id}" aria-pressed="${value===o.id}">${o.label}</button>`).join('')}</div>`}
function sense(){return `${backBtn()}<div class="flow-shell">${progress(1,app.mode==='quick'?3:4)}<div class="flow-head"><span class="micro">SCHRITT 1 · WAHRNEHMEN</span><h1>Wie fühlt es sich gerade an?</h1><p class="sub">Du brauchst noch keinen Emotionsbegriff zu kennen. Auch Unsicherheit ist eine gültige Antwort.</p></div><div class="flow-card"><h3>Dein momentanes Erleben</h3>${choiceQuestion('Wie angenehm oder unangenehm fühlt es sich an?',[{id:'pleasant',label:'Angenehm'},{id:'unpleasant',label:'Unangenehm'},{id:'mixed',label:'Gemischt'},{id:'neutral',label:'Neutral'},{id:'unknown',label:'Unklar'}],app.valence,'valence')}${choiceQuestion('Wie viel innere Energie nimmst du wahr?',[{id:'high',label:'Viel Energie'},{id:'medium',label:'Mittel'},{id:'low',label:'Wenig Energie'},{id:'unknown',label:'Unklar'}],app.energy,'energy')}<div class="flow-footer"><button class="btn text" data-action="flowSkipSense">Überspringen</button><button class="btn" data-action="toChoose">Weiter ${icon('arrow',16)}</button></div></div></div>`}
function choose(){const query=app.choiceQuery.trim().toLocaleLowerCase('de');let words=CATALOG.filter(w=>(app.choiceFamily==='all'||app.choiceFamily===w.family)&&(!query||[w.name,w.definition,...w.related].join(' ').toLocaleLowerCase('de').includes(query))).slice(0,18);let keys=Object.keys(app.selected);return `${backBtn()}<div class="flow-shell">${progress(2,app.mode==='quick'?3:4)}<div class="flow-head"><span class="micro">SCHRITT 2 · BENENNEN</span><h1>Welche Worte könnten passen?</h1><p class="sub">Wähle ein oder mehrere Gefühle. Du darfst auch ohne Auswahl weitermachen.</p></div><div class="flow-card"><h3>Deine Auswahl</h3><p class="sub">Intensität ist optional. Ein Fragezeichen bedeutet: noch nicht eingeschätzt.</p>${keys.length?`<div class="selected-panel">${keys.map(id=>`<div class="intensity-row"><label for="int-${id}">${esc(getName(id))}</label><input id="int-${id}" type="range" min="1" max="10" value="${app.selected[id]??5}" data-intensity="${id}" aria-label="Intensität für ${esc(getName(id))}"/><output for="int-${id}" id="out-${id}">${app.selected[id]===null?'?':app.selected[id]+'/10'}</output><button class="x-btn" data-action="removeEmotion" data-id="${id}" aria-label="${esc(getName(id))} entfernen">×</button></div>`).join('')}<div class="muted" style="font-size:12px;margin-top:9px">Bewege den Regler, um eine Intensität festzulegen.</div></div>`:''}<div class="question-label">Emotionen entdecken und auswählen</div><div class="pill-row" style="margin:11px 0"><button class="chip ${app.choiceFamily==='all'?'active':''}" data-action="choiceFamily" data-id="all">Alle</button>${FAMILIES.map(f=>`<button class="chip ${app.choiceFamily===f.id?'active':''}" data-action="choiceFamily" data-id="${f.id}">${esc(f.name)}</button>`).join('')}</div><div class="search inline-search">${icon('search')}<input type="search" id="choiceSearch" placeholder="Begriff suchen …" value="${esc(app.choiceQuery)}" aria-label="Gefühle im Check-in suchen"></div><div id="choiceResults" class="emotion-results">${choiceResults(words)}</div>${keys.length===0?`<p class="muted" style="font-size:13px;margin-top:10px">Noch keine Auswahl – das ist in Ordnung.</p>`:''}<div class="flow-footer"><button class="btn text" data-action="flowSkipChoose">Ohne Einordnung weiter</button><button class="btn" data-action="afterChoose">${app.mode==='quick'?'Zusammenfassung':'Reflexion'} ${icon('arrow',16)}</button></div></div></div>`}
function choiceResults(words){return words.length?words.map(w=>`<div style="display:flex;align-items:center;gap:3px"><button class="emotion-pick ${Object.hasOwn(app.selected,w.id)?'active':''}" data-action="toggleEmotion" data-id="${w.id}"><span class="grow"><span class="strong">${esc(w.name)}</span><small> · ${esc(familyInfo(w.family).name)}</small></span>${icon(Object.hasOwn(app.selected,w.id)?'check':'plus',16)}</button><button class="icon-link" data-action="detail" data-id="${w.id}" aria-label="Mehr über ${esc(w.name)}">${icon('info',18)}</button></div>`).join(''):`<div class="empty"><strong>Kein Treffer</strong><p>Du kannst ohne Auswahl fortfahren oder den Suchbegriff ändern.</p></div>`}
function reflection(){const p=prompts[app.reflectionIndex],last=app.reflectionIndex===prompts.length-1;return `${backBtn()}<div class="flow-shell">${progress(3,4)}<div class="flow-head"><span class="micro">SCHRITT 3 · REFLEKTIEREN · FRAGE ${app.reflectionIndex+1} VON ${prompts.length}</span><h1>${esc(p.heading)}</h1><p class="sub">${esc(p.hint)}</p></div><div class="flow-card"><div class="field"><label for="reflectionInput">Deine Gedanken (freiwillig)</label><textarea id="reflectionInput" placeholder="${esc(p.placeholder)}">${esc(app.notes[p.key])}</textarea></div><div class="notice">${icon('leaf',18)}<span>Dein Text bleibt nur in dieser geöffneten Vorschau. Du kannst jederzeit überspringen oder zurückgehen.</span></div><div class="flow-footer"><button class="btn text" data-action="skipReflection">Frage überspringen</button><button class="btn" data-action="nextReflection">${last?'Zur Zusammenfassung':'Weiter'} ${icon('arrow',16)}</button></div><div class="flex" style="justify-content:center;margin-top:18px"><button class="link-btn" data-action="previousReflection" ${app.reflectionIndex===0?'disabled':''}>${icon('back',14)} Vorherige Frage</button></div></div></div>`}
const valenceNames={pleasant:'Eher angenehm',unpleasant:'Eher unangenehm',mixed:'Gemischt',neutral:'Neutral',unknown:'Unklar'},energyNames={high:'Viel innere Energie',medium:'Mittlere Energie',low:'Wenig innere Energie',unknown:'Unklar'};
function summary(){const selected=Object.entries(app.selected),notes=prompts.filter(p=>app.notes[p.key]?.trim());return `${backBtn()}<div class="flow-shell">${progress(app.mode==='quick'?3:4,app.mode==='quick'?3:4)}<div class="flow-head"><span class="micro">ABSCHLUSS · DEIN MOMENT</span><h1>Dein persönlicher Blick</h1><p class="sub">So hast du diesen Moment beschrieben. Du kannst alles noch ändern – oder ohne Speichern abschließen.</p></div><div class="flow-card"><div class="card sage" style="box-shadow:none"><span class="micro">DEINE GEFÜHLE</span><div class="pill-row mt-14">${selected.length?selected.map(([id,n])=>`<span class="tag" style="font-size:14px;padding:8px 11px">${esc(getName(id))}${n===null?'':' · '+n+'/10'}</span>`).join(''):'<span class="muted">Noch kein Gefühl benannt – und das ist okay.</span>'}</div><div class="divider"></div><div class="muted" style="font-size:13px">${esc(valenceNames[app.valence]||'Angenehmheit nicht angegeben')} · ${esc(energyNames[app.energy]||'Energie nicht angegeben')}</div></div>${notes.length?notes.map(p=>`<div class="summary-field"><small>${esc(p.heading)}</small><p>${esc(app.notes[p.key])}</p></div>`).join(''):`<div class="summary-field"><small>REFLEXION</small><p>Du hast keine zusätzlichen Gedanken notiert. Auch ein kurzer Moment der Wahrnehmung zählt.</p></div>`}<div class="button-group mt-20"><button class="btn secondary" data-action="editFeelings">${icon('edit',16)} Gefühle ändern</button><button class="btn ghost" data-action="editReflection">${icon('edit',16)} Gedanken ändern</button></div><div class="divider"></div><div class="button-group"><button class="btn" data-action="saveDemo">${icon('check',17)} In diese Sitzung übernehmen</button><button class="btn text" data-action="discardDraft">Ohne Speichern beenden</button></div><p class="muted" style="font-size:12px;margin-top:12px">Nur Demonstration: Nach dem Neuladen der Seite sind die Einträge weg.</p></div></div>`}
function journal(){const saved=app.sessionEntries;return `${heading('REFLEXION · ERINNERUNGEN','Dein Tagebuch','Hier kannst du später deine emotionalen Erfahrungen wiederfinden und Zusammenhänge entdecken.')}<div class="button-group mb-20"><button class="btn" data-action="flowStart">${icon('plus',16)} Neuer Check-in</button><button class="btn ghost" data-main="atlas">${icon('book',16)} Zum Emotionsatlas</button></div>${saved.length?`<div class="section-row"><h2>Einträge dieser Sitzung</h2><span class="tag">${saved.length} ${saved.length===1?'Eintrag':'Einträge'}</span></div>${saved.map(e=>journalCard(e)).join('')}`:`<div class="empty"><span class="round-icon">${icon('journal',24)}</span><strong>Hier ist noch Platz für deine Gedanken.</strong><p>Beginne einen Check-in und übernimm ihn in diese Sitzung. Du kannst alle Einträge wieder bearbeiten oder löschen.</p><button class="btn mt-20" data-action="flowStart">Gefühl erkunden ${icon('arrow',16)}</button></div>`}<div class="section-row"><h2>So könnte ein Eintrag aussehen</h2><span class="tag outline">Fiktives Beispiel</span></div>${journalCard({id:'example',created:'Beispiel · gestern',selected:{erleichterung:7,stolz:6},notes:{situation:'Eine Aufgabe abgeschlossen, vor der ich lange Respekt hatte.',insight:'Ich darf kleine Erfolge bewusst wahrnehmen.'}},true)}<div class="notice mt-20">${icon('shield',18)}<span>Dies ist eine Design-Demonstration ohne verschlüsselte Datenbank. Trage hier am besten nur fiktive Inhalte ein.</span></div>`}
function journalCard(e,demo=false){let selected=Object.entries(e.selected||{});return `<button class="journal-entry" data-action="journalDetail" data-id="${esc(e.id)}"><div class="card-head"><strong>${esc(e.created)}</strong><span class="muted">${icon('chevron',17)}</span></div><div class="pill-row" style="margin-top:9px">${selected.length?selected.map(([id,n])=>`<span class="chip" style="pointer-events:none">${esc(getName(id))}${n!==null?' · '+n+'/10':''}</span>`).join(''):'<span class="chip">Nicht eingeordnet</span>'}</div><p>${esc(e.notes?.situation||e.notes?.insight||'Ein kurzer Moment zum Innehalten.')}</p>${demo?'<small class="muted">Nur zur Veranschaulichung</small>':''}</button>`}
function journalDetail(){const e=app.journalViewing==='example'?{id:'example',created:'Fiktives Beispiel',selected:{erleichterung:7,stolz:6},notes:{situation:'Eine Aufgabe abgeschlossen, vor der ich lange Respekt hatte.',insight:'Ich darf kleine Erfolge bewusst wahrnehmen.'}}:app.sessionEntries.find(e=>e.id===app.journalViewing);if(!e)return `<div class="empty">Der Eintrag ist nicht mehr verfügbar.</div>`;let demo=e.id==='example';return `${backBtn()}${heading(demo?'FIKTIVES BEISPIEL':'DEINE SITZUNG','Ein Moment im Rückblick',esc(e.created))}<div class="flow-shell"><div class="card"><h3>Gefühle</h3><div class="pill-row mt-14">${Object.entries(e.selected).length?Object.entries(e.selected).map(([id,intensity])=>`<span class="tag">${esc(getName(id))}${intensity===null?'':' · '+intensity+'/10'}</span>`).join(''):'<span class="muted">Nicht benannt</span>'}</div>${prompts.filter(p=>e.notes[p.key]?.trim()).map(p=>`<div class="summary-field"><small>${esc(p.heading)}</small><p>${esc(e.notes[p.key])}</p></div>`).join('')}${!demo?`<div class="divider"></div><div class="button-group"><button class="btn secondary" data-action="editEntry">${icon('edit',17)} Bearbeiten</button><button class="btn ghost" data-action="deleteEntry">${icon('trash',17)} Löschen</button></div>${app.confirmDelete?`<div class="notice mt-20" style="display:block"><strong>Eintrag wirklich entfernen?</strong><p>Diese Aktion kann innerhalb dieser Sitzung nicht rückgängig gemacht werden.</p><div class="button-group mt-14"><button class="btn danger sm" data-action="confirmDelete">Ja, löschen</button><button class="btn ghost sm" data-action="cancelDelete">Abbrechen</button></div></div>`:''}`:'<div class="notice mt-20">Dieses Beispiel ist nicht bearbeitbar. Eigene Sitzungs-Einträge kannst du ändern oder löschen.</div>'}</div></div>`}
function insights(){return `${heading('RÜCKBLICK · VERSTEHEN','Deine Muster entdecken','Später werden hier deine eigenen Einträge behutsam in Zusammenhänge gebracht – ohne Bewertungen oder Diagnosen.')}<div class="grid-2"><div class="card sage"><span class="round-icon pine">${icon('chart',22)}</span><h3 style="margin-top:17px">Gefühle im Verlauf</h3><p class="sub" style="font-size:14px;margin-top:8px">Welche Begriffe tauchen häufig auf? Welche gleichzeitig? Die Auswertung bleibt später lokal auf deinem Gerät.</p></div><div class="card cream"><span class="round-icon sand">${icon('sparkle',22)}</span><h3 style="margin-top:17px">Fragen statt Urteile</h3><p class="sub" style="font-size:14px;margin-top:8px">„Welche Situationen waren mit Unsicherheit verbunden?“ statt „Du bist zu oft unsicher“.</p></div></div><div class="empty mt-20"><span class="round-icon">${icon('clock',22)}</span><strong>Diese Funktion folgt in einem späteren Schritt.</strong><p>Im Prototyp zeigen wir nur die geplante Gestaltung. Es werden keine Statistiken aus privaten Texten berechnet.</p><button class="btn secondary mt-20" data-main="journal">Zum Tagebuch</button></div>`}
function settings(){return `${backBtn()}${heading('DEIN RAUM · INFORMATION','Über diesen Prototyp','Ein gemeinsamer, anklickbarer Entwurf für die spätere native Android-App.')}<div class="grid-2"><div class="card"><span class="round-icon">${icon('shield',22)}</span><h3 style="margin-top:15px">Nur eine Vorschau</h3><p class="sub" style="font-size:14px;margin-top:8px">Deine Eingaben werden ausschließlich im Arbeitsspeicher dieser geöffneten Seite verwaltet. Beim Neuladen oder Schließen verschwinden sie. Es gibt kein Konto, keine Cloud und keine echte Verschlüsselung von Tagebucheinträgen, weil keine Datenbank verwendet wird.</p></div><div class="card"><span class="round-icon sand">${icon('layers',22)}</span><h3 style="margin-top:15px">Designrichtung D</h3><p class="sub" style="font-size:14px;margin-top:8px">Warmes Salbeigrün, Sandtöne, Petrol, großzügige Abstände und klare Typografie. Der Entwurf ist bewusst nicht klinisch und verzichtet auf Bewertungen.</p></div></div><div class="card mt-20"><h3>Vorschau zurücksetzen</h3><p class="sub" style="font-size:14px;margin:9px 0 17px">Alle während der Sitzung erstellten Demo-Einträge und Formulare zurücksetzen. Die fiktiven Beispielinhalte bleiben als Anschauung sichtbar.</p><button class="btn ghost" data-action="resetAll">${icon('trash',17)} Vorschau zurücksetzen</button></div><div class="notice mt-20">${icon('info',18)}<span>Emotionskompass ist als Lern- und Reflexionswerkzeug gedacht. Es ersetzt keine psychologische Beratung, Diagnose oder Behandlung.</span></div>`}
function render(){navMarkup();document.querySelectorAll('span[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon,19)});let output={home,atlas,detail,compare,flowStart,situationFirst,sense,choose,reflection,summary,journal,journalDetail,insights,settings}[app.screen];document.getElementById('screen').innerHTML=(output||home)();}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(toast.id);toast.id=setTimeout(()=>t.hidden=true,3600)}
function showDetail(id){if(!getWord(id))return;app.detail=id;nav('detail')}
function chooseEmotion(id){if(Object.hasOwn(app.selected,id)){delete app.selected[id]}else app.selected[id]=null;render();}
function endRef(){app.reflectionIndex=0;nav('summary')}
function saveDemo(){const id=app.journalEditId||('demo-'+Date.now()+'-'+Math.random().toString(36).slice(2,5));const now=new Date();const record={id,created:app.journalEditId?(app.sessionEntries.find(e=>e.id===id)?.created||'In dieser Sitzung'):'Heute · '+now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),selected:{...app.selected},valence:app.valence,energy:app.energy,notes:{...app.notes}};if(app.journalEditId){const i=app.sessionEntries.findIndex(e=>e.id===id);if(i>=0)app.sessionEntries[i]=record;else app.sessionEntries.unshift(record)}else app.sessionEntries.unshift(record);resetDraft();goMain('journal');toast('Für diese Sitzung übernommen. Keine dauerhafte Speicherung.');}
function act(action,el){const id=el.dataset.id;switch(action){case'back':back();break;case'flowStart':nav('flowStart');break;case'detail':showDetail(id);break;case'comparePreset':app.compareA='frustration';app.compareB='enttaeuschung';nav('compare');break;case'compareFromWord':{const w=getWord(id);app.compareA=id;app.compareB=id==='frustration'?'enttaeuschung':id==='enttaeuschung'?'frustration':CATALOG.find(x=>x.name===w.related[0])?.id||CATALOG.find(x=>x.name===w.contrast[0])?.id||'enttaeuschung';if(app.compareA===app.compareB)app.compareB='frustration';nav('compare');break}case'compareSpecific':app.compareA=id;app.compareB=el.dataset.other;nav('compare');break;case'flowFromWord':if(app.stack.includes('choose')||app.stack.includes('reflection')){if(!Object.hasOwn(app.selected,id))app.selected[id]=null;app.stack=[];app.screen='choose';render();window.scrollTo({top:0,behavior:'instant'})}else beginFlow('deep','some',id);break;case'setMode':app.mode=el.dataset.value;render();break;case'chooseEntry':{const selectedMode=app.mode;resetDraft();app.mode=selectedMode;app.entryPath=el.dataset.path;nav(app.entryPath==='situation'&&app.mode==='deep'?'situationFirst':'sense');break}case'skipIntro':app.notes.situation='';nav('sense');break;case'fromIntro':nav('sense');break;case'valence':app.valence=el.dataset.value;render();break;case'energy':app.energy=el.dataset.value;render();break;case'flowSkipSense':app.valence=null;app.energy=null;nav('choose');break;case'toChoose':nav('choose');break;case'choiceFamily':app.choiceFamily=id;render();break;case'toggleEmotion':chooseEmotion(id);break;case'removeEmotion':delete app.selected[id];render();break;case'flowSkipChoose':app.selected={};if(app.mode==='quick'){nav('summary')}else{app.reflectionIndex=app.entryPath==='situation'?1:0;nav('reflection')}break;case'afterChoose':if(app.mode==='quick'){nav('summary')}else{app.reflectionIndex=app.entryPath==='situation'?1:0;nav('reflection')}break;case'nextReflection':if(app.reflectionIndex<prompts.length-1){app.reflectionIndex++;render()}else endRef();break;case'skipReflection':app.notes[prompts[app.reflectionIndex].key]='';if(app.reflectionIndex<prompts.length-1){app.reflectionIndex++;render()}else endRef();break;case'previousReflection':if(app.reflectionIndex>0){app.reflectionIndex--;render()}break;case'editFeelings':nav('choose');break;case'editReflection':app.mode='deep';app.reflectionIndex=0;nav('reflection');break;case'saveDemo':saveDemo();break;case'discardDraft':resetDraft();goMain('home');toast('Check-in beendet – nichts übernommen.');break;case'journalDetail':app.journalViewing=id;nav('journalDetail');break;case'editEntry':{const e=app.sessionEntries.find(e=>e.id===app.journalViewing);if(e){resetDraft();app.journalEditId=e.id;app.selected={...e.selected};app.valence=e.valence;app.energy=e.energy;app.notes={...app.notes,...e.notes};app.mode='deep';nav('summary')}break}case'deleteEntry':app.confirmDelete=true;render();break;case'cancelDelete':app.confirmDelete=false;render();break;case'confirmDelete':app.sessionEntries=app.sessionEntries.filter(e=>e.id!==app.journalViewing);app.confirmDelete=false;goMain('journal');toast('Demo-Eintrag entfernt.');break;case'resetAll':resetDraft();app.sessionEntries=[];app.atlasFamily='all';app.atlasQuery='';goMain('home');toast('Die Vorschau wurde zurückgesetzt.');break;case'family':app.atlasFamily=id;render();break;case'clearFamily':app.atlasFamily='all';render();break;case'resetAtlas':app.atlasFamily='all';app.atlasQuery='';render();break;}}
function updateSearch(input,type){let search=document.getElementById(type==='atlas'?'atlasSearch':'choiceSearch');let cursor=search?.selectionStart??0;if(type==='atlas'){app.atlasQuery=input;const q=input.toLocaleLowerCase('de').trim();let words=filterWords(app.atlasFamily,input);let list=document.getElementById('atlasResults');if(list)list.innerHTML=atlasResultMarkup(words);let section=list?.previousElementSibling?.lastElementChild;if(section)section.textContent=words.length+' Treffer';}else{app.choiceQuery=input;const q=input.toLocaleLowerCase('de').trim();let words=CATALOG.filter(w=>(app.choiceFamily==='all'||app.choiceFamily===w.family)&&(!q||[w.name,w.definition,...w.related].join(' ').toLocaleLowerCase('de').includes(q))).slice(0,18);document.getElementById('choiceResults').innerHTML=choiceResults(words)}}
document.addEventListener('click',ev=>{let btn=ev.target.closest('[data-action],[data-main],[data-go]');if(!btn)return;if(btn.dataset.main)goMain(btn.dataset.main);else if(btn.dataset.go)nav(btn.dataset.go);else act(btn.dataset.action,btn)});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='atlasSearch')updateSearch(t.value,'atlas');else if(t.id==='choiceSearch')updateSearch(t.value,'choice');else if(t.id==='reflectionInput')app.notes[prompts[app.reflectionIndex].key]=t.value;else if(t.id==='introSituation')app.notes.situation=t.value;else if(t.dataset.intensity){app.selected[t.dataset.intensity]=Number(t.value);let out=document.getElementById('out-'+t.dataset.intensity);if(out)out.textContent=t.value+'/10'}});
document.addEventListener('change',ev=>{if(ev.target.id==='compareA'){app.compareA=ev.target.value;render()}else if(ev.target.id==='compareB'){app.compareB=ev.target.value;render()}});
render();
</script>
